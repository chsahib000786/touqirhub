<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compound Interest Calculator | TouqirHub</title>
    <meta name="description" content="Free Compound Interest Calculator. Calculate compound interest and total investment value easily.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            padding: 45px 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 34px;
        }

        .calculator-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(25, 35, 55, 0.08);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce2ea;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f8f4;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 29px;
            }

            .calculator-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Compound Interest Calculator</h1>

    <div class="calculator-card">

        <label for="principal">Initial Investment</label>
        <input
            type="number"
            id="principal"
            placeholder="e.g. 10000"
            min="0"
            step="0.01"
        >

        <label for="rate">Annual Interest Rate (%)</label>
        <input
            type="number"
            id="rate"
            placeholder="e.g. 7"
            min="0"
            step="0.01"
        >

        <label for="years">Time Period (Years)</label>
        <input
            type="number"
            id="years"
            placeholder="e.g. 10"
            min="0"
            step="0.1"
        >

        <label for="frequency">Compounding Frequency</label>

        <select id="frequency">
            <option value="1">Annually</option>
            <option value="2">Semi-annually</option>
            <option value="4">Quarterly</option>
            <option value="12" selected>Monthly</option>
            <option value="365">Daily</option>
        </select>

        <button onclick="calculateCompoundInterest()">
            Calculate
        </button>

        <div id="result" class="result">
            Enter your investment details.
        </div>

    </div>

    <a href="calculators.html" class="back">
        ← Back to Calculators
    </a>

</div>

<script>
function calculateCompoundInterest() {

    const principal = parseFloat(
        document.getElementById("principal").value
    );

    const rate = parseFloat(
        document.getElementById("rate").value
    );

    const years = parseFloat(
        document.getElementById("years").value
    );

    const frequency = parseInt(
        document.getElementById("frequency").value
    );

    const result = document.getElementById("result");

    if (
        isNaN(principal) ||
        isNaN(rate) ||
        isNaN(years) ||
        principal < 0 ||
        rate < 0 ||
        years < 0
    ) {
        result.innerHTML = "Please enter valid values.";
        return;
    }

    const amount =
        principal *
        Math.pow(
            1 + (rate / 100) / frequency,
            frequency * years
        );

    const interest = amount - principal;

    result.innerHTML =
        "<strong>Final Amount:</strong> " +
        amount.toFixed(2) +
        "<br>" +
        "<strong>Total Interest:</strong> " +
        interest.toFixed(2);
}
</script>

</body>
</html>
