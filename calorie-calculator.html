<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calorie Calculator | TouqirHub</title>
    <meta name="description" content="Free Calorie Calculator. Estimate your daily calorie needs based on age, gender, height, weight and activity level.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            padding: 45px 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .calculator-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(25, 35, 55, 0.08);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce2ea;
            border-radius: 10px;
            font-size: 16px;
            background: #fff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f8f4;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
        }

        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #727b8f;
            line-height: 1.5;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .calculator-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Calorie Calculator</h1>

    <div class="calculator-card">

        <label for="gender">Gender</label>

        <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label for="age">Age (Years)</label>
        <input
            type="number"
            id="age"
            placeholder="e.g. 25"
            min="1"
            max="120"
        >

        <label for="weight">Weight (kg)</label>
        <input
            type="number"
            id="weight"
            placeholder="e.g. 70"
            min="1"
            step="0.1"
        >

        <label for="height">Height (cm)</label>
        <input
            type="number"
            id="height"
            placeholder="e.g. 175"
            min="1"
            step="0.1"
        >

        <label for="activity">Activity Level</label>

        <select id="activity">
            <option value="1.2">Sedentary - little exercise</option>
            <option value="1.375">Lightly active - 1-3 days/week</option>
            <option value="1.55">Moderately active - 3-5 days/week</option>
            <option value="1.725">Very active - 6-7 days/week</option>
            <option value="1.9">Extra active - very hard exercise</option>
        </select>

        <button onclick="calculateCalories()">
            Calculate Calories
        </button>

        <div id="result" class="result">
            Enter your details.
        </div>

        <div class="note">
            This is an estimate based on the Mifflin-St Jeor equation.
        </div>

    </div>

    <a href="calculators.html" class="back">
        ← Back to Calculators
    </a>

</div>

<script>
function calculateCalories() {

    const gender =
        document.getElementById("gender").value;

    const age =
        parseFloat(document.getElementById("age").value);

    const weight =
        parseFloat(document.getElementById("weight").value);

    const height =
        parseFloat(document.getElementById("height").value);

    const activity =
        parseFloat(document.getElementById("activity").value);

    const result =
        document.getElementById("result");

    if (
        isNaN(age) ||
        isNaN(weight) ||
        isNaN(height) ||
        age <= 0 ||
        weight <= 0 ||
        height <= 0
    ) {
        result.innerHTML =
            "Please enter valid information.";
        return;
    }

    let bmr;

    if (gender === "male") {

        bmr =
            (10 * weight) +
            (6.25 * height) -
            (5 * age) +
            5;

    } else {

        bmr =
            (10 * weight) +
            (6.25 * height) -
            (5 * age) -
            161;
    }

    const dailyCalories = bmr * activity;

    result.innerHTML =
        "<strong>Estimated Daily Calories:</strong><br>" +
        dailyCalories.toFixed(0) +
        " calories/day";
}
</script>

</body>
</html>
