<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Calculator | TouqirHub</title>
    <meta name="description" content="Free Tip Calculator. Calculate tip amount, total bill and split the bill between people.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            padding: 45px 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .calculator-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(25, 35, 55, 0.08);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce2ea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f8f4;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .calculator-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Tip Calculator</h1>

    <div class="calculator-card">

        <label for="bill">Bill Amount</label>
        <input
            type="number"
            id="bill"
            placeholder="e.g. 5000"
            min="0"
            step="0.01"
        >

        <label for="tip">Tip Percentage (%)</label>
        <input
            type="number"
            id="tip"
            placeholder="e.g. 15"
            min="0"
            step="0.1"
        >

        <label for="people">Number of People</label>
        <input
            type="number"
            id="people"
            placeholder="e.g. 2"
            min="1"
            step="1"
            value="1"
        >

        <button onclick="calculateTip()">
            Calculate Tip
        </button>

        <div id="result" class="result">
            Enter your bill details.
        </div>

    </div>

    <a href="calculators.html" class="back">
        ← Back to Calculators
    </a>

</div>

<script>
function calculateTip() {

    const bill = parseFloat(
        document.getElementById("bill").value
    );

    const tipPercent = parseFloat(
        document.getElementById("tip").value
    );

    const people = parseInt(
        document.getElementById("people").value
    );

    const result = document.getElementById("result");

    if (
        isNaN(bill) ||
        isNaN(tipPercent) ||
        isNaN(people) ||
        bill < 0 ||
        tipPercent < 0 ||
        people < 1
    ) {
        result.innerHTML =
            "Please enter valid values.";
        return;
    }

    const tipAmount = bill * tipPercent / 100;
    const totalBill = bill + tipAmount;
    const perPerson = totalBill / people;

    result.innerHTML =
        "<strong>Tip Amount:</strong> " +
        tipAmount.toFixed(2) +
        "<br>" +
        "<strong>Total Bill:</strong> " +
        totalBill.toFixed(2) +
        "<br>" +
        "<strong>Per Person:</strong> " +
        perPerson.toFixed(2);
}
</script>

</body>
</html>
