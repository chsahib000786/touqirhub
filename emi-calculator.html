<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMI Calculator | TouqirHub</title>
    <meta name="description" content="Free EMI Calculator. Calculate monthly EMI, total interest and total repayment for your loan.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            padding: 45px 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .calculator-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(25, 35, 55, 0.08);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce2ea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f8f4;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .calculator-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>EMI Calculator</h1>

    <div class="calculator-card">

        <label for="loanAmount">Loan Amount</label>
        <input
            type="number"
            id="loanAmount"
            placeholder="e.g. 1000000"
            min="0"
            step="0.01"
        >

        <label for="interestRate">Annual Interest Rate (%)</label>
        <input
            type="number"
            id="interestRate"
            placeholder="e.g. 10"
            min="0"
            step="0.01"
        >

        <label for="loanTenure">Loan Tenure (Years)</label>
        <input
            type="number"
            id="loanTenure"
            placeholder="e.g. 5"
            min="0.1"
            step="0.1"
        >

        <button onclick="calculateEMI()">
            Calculate EMI
        </button>

        <div id="result" class="result">
            Enter your loan details.
        </div>

    </div>

    <a href="calculators.html" class="back">
        ← Back to Calculators
    </a>

</div>

<script>
function calculateEMI() {

    const loanAmount = parseFloat(
        document.getElementById("loanAmount").value
    );

    const annualRate = parseFloat(
        document.getElementById("interestRate").value
    );

    const years = parseFloat(
        document.getElementById("loanTenure").value
    );

    const result = document.getElementById("result");

    if (
        isNaN(loanAmount) ||
        isNaN(annualRate) ||
        isNaN(years) ||
        loanAmount <= 0 ||
        annualRate < 0 ||
        years <= 0
    ) {
        result.innerHTML = "Please enter valid loan details.";
        return;
    }

    const months = Math.round(years * 12);
    const monthlyRate = annualRate / 100 / 12;

    let emi;

    if (monthlyRate === 0) {

        emi = loanAmount / months;

    } else {

        emi =
            loanAmount *
            monthlyRate *
            Math.pow(1 + monthlyRate, months) /
            (Math.pow(1 + monthlyRate, months) - 1);
    }

    const totalPayment = emi * months;
    const totalInterest = totalPayment - loanAmount;

    result.innerHTML =
        "<strong>Monthly EMI:</strong> " +
        emi.toFixed(2) +
        "<br>" +
        "<strong>Total Interest:</strong> " +
        totalInterest.toFixed(2) +
        "<br>" +
        "<strong>Total Payment:</strong> " +
        totalPayment.toFixed(2);
}
</script>

</body>
</html>
