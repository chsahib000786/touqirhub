<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discount Calculator | TouqirHub</title>
    <meta name="description" content="Free Discount Calculator. Calculate discounts, savings and final prices quickly and easily.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            padding: 45px 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .calculator-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(25, 35, 55, 0.08);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce2ea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f8f4;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .calculator-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Discount Calculator</h1>

    <div class="calculator-card">

        <label for="price">Original Price</label>
        <input
            type="number"
            id="price"
            placeholder="e.g. 5000"
            min="0"
            step="0.01"
        >

        <label for="discount">Discount (%)</label>
        <input
            type="number"
            id="discount"
            placeholder="e.g. 20"
            min="0"
            max="100"
            step="0.01"
        >

        <button onclick="calculateDiscount()">
            Calculate Discount
        </button>

        <div id="result" class="result">
            Enter the original price and discount.
        </div>

    </div>

    <a href="calculators.html" class="back">
        ← Back to Calculators
    </a>

</div>

<script>
function calculateDiscount() {

    const price = parseFloat(
        document.getElementById("price").value
    );

    const discount = parseFloat(
        document.getElementById("discount").value
    );

    const result = document.getElementById("result");

    if (
        isNaN(price) ||
        isNaN(discount) ||
        price < 0 ||
        discount < 0 ||
        discount > 100
    ) {
        result.innerHTML =
            "Please enter valid values.";
        return;
    }

    const savings = price * discount / 100;
    const finalPrice = price - savings;

    result.innerHTML =
        "<strong>You Save:</strong> " +
        savings.toFixed(2) +
        "<br>" +
        "<strong>Final Price:</strong> " +
        finalPrice.toFixed(2);
}
</script>

</body>
</html>
