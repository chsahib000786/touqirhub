<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>General Calculator</title>

<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fafc,#eaf8f6);
}

.calculator{
    width:100%;
    max-width:540px;
    background:#fff;
    padding:18px;
    border-radius:28px;
    box-shadow:0 18px 45px rgba(25,40,65,.14);
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.brand{
    font-size:15px;
    font-weight:bold;
}

.mode{
    display:flex;
    gap:5px;
}

.mode button{
    border:0;
    padding:8px 10px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.mode button.active{
    background:#4f46e5;
    color:white;
}

.calculator-type{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
    background:#f1f4f8;
    padding:5px;
    border-radius:13px;
    margin-bottom:14px;
}

.calculator-type button{
    border:0;
    background:transparent;
    padding:11px 8px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
    color:#526078;
}

.calculator-type button.active{
    background:#4f46e5;
    color:white;
}

.screen{
    background:#111827;
    color:white;
    min-height:145px;
    border-radius:21px;
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    margin-bottom:14px;
    overflow:hidden;
}

.expression{
    color:#aab5c8;
    font-size:16px;
    text-align:right;
    min-height:27px;
    overflow-x:auto;
}

.result{
    text-align:right;
    font-size:clamp(30px,8vw,43px);
    font-weight:bold;
    word-break:break-all;
}

.scientific{
    display:none;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-bottom:10px;
}

.scientific.show{
    display:grid;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.key{
    border:0;
    min-height:54px;
    border-radius:15px;
    background:#f3f6fa;
    color:#172033;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.12s;
}

.key:hover{
    filter:brightness(.96);
}

.key:active{
    transform:scale(.96);
}

.small{
    min-height:43px;
    font-size:13px;
}

.operator{
    background:#e8edff;
    color:#3d42a8;
}

.equals{
    background:linear-gradient(135deg,#4f46e5,#6366f1);
    color:white;
}

.clear{
    background:#fee2e2;
    color:#b91c1c;
}

.delete{
    background:#fff0f0;
    color:#dc2626;
}

.memory{
    background:#edf7f6;
    color:#147b72;
}

.zero{
    grid-column:span 2;
}

.history{
    display:none;
    margin-top:12px;
    border-top:1px solid #e6ebf2;
    padding-top:12px;
    max-height:210px;
    overflow:auto;
}

.history.open{
    display:block;
}

.history-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:7px;
}

.history-head button{
    border:0;
    background:none;
    color:#ef4444;
    font-weight:bold;
    cursor:pointer;
}

.history-item{
    padding:9px 4px;
    border-bottom:1px solid #edf0f4;
    cursor:pointer;
}

.h-exp{
    color:#728096;
    font-size:12px;
}

.h-res{
    font-weight:bold;
    margin-top:2px;
}

.error{
    color:#ff9b9b;
}

@media(max-width:420px){

    body{
        padding:8px;
    }

    .calculator{
        padding:12px;
        border-radius:22px;
    }

    .scientific,
    .grid{
        gap:6px;
    }

    .key{
        min-height:49px;
        border-radius:13px;
        font-size:15px;
    }

    .small{
        font-size:12px;
    }

    .screen{
        min-height:125px;
        padding:14px;
    }
}
</style>
</head>

<body>

<div class="calculator">

<div class="topbar">

    <div class="brand" id="brand">
        General Calculator
    </div>

    <div class="mode">

        <button id="degBtn"
                class="active"
                onclick="setAngle('DEG')">
            DEG
        </button>

        <button id="radBtn"
                onclick="setAngle('RAD')">
            RAD
        </button>

    </div>

</div>

<div class="calculator-type">

    <button id="simpleBtn"
            class="active"
            onclick="setCalculatorMode('simple')">
        Simple Calculator
    </button>

    <button id="scientificBtn"
            onclick="setCalculatorMode('scientific')">
        Scientific Calculator
    </button>

</div>

<div class="screen">

    <div id="expression"
         class="expression">
    </div>

    <div id="result"
         class="result">
        0
    </div>

</div>

<div id="scientificFunctions"
     class="scientific">

    <button class="key small memory"
            onclick="memoryClear()">
        MC
    </button>

    <button class="key small memory"
            onclick="memoryRecall()">
        MR
    </button>

    <button class="key small memory"
            onclick="memoryAdd()">
        M+
    </button>

    <button class="key small memory"
            onclick="memorySub()">
        M−
    </button>

    <button class="key small operator"
            onclick="insert('(')">
        (
    </button>

    <button class="key small operator"
            onclick="insert(')')">
        )
    </button>

    <button class="key small"
            onclick="fn('sin')">
        sin
    </button>

    <button class="key small"
            onclick="fn('cos')">
        cos
    </button>

    <button class="key small"
            onclick="fn('tan')">
        tan
    </button>

    <button class="key small"
            onclick="fn('log')">
        log
    </button>

    <button class="key small"
            onclick="fn('ln')">
        ln
    </button>

    <button class="key small"
            onclick="insert('π')">
        π
    </button>

    <button class="key small"
            onclick="fn('sqrt')">
        √
    </button>

    <button class="key small"
            onclick="fn('square')">
        x²
    </button>

    <button class="key small"
            onclick="insert('^')">
        xʸ
    </button>

    <button class="key small"
            onclick="fn('reciprocal')">
        1/x
    </button>

    <button class="key small"
            onclick="fn('factorial')">
        x!
    </button>

    <button class="key small"
            onclick="insert('e')">
        e
    </button>

</div>

<div class="grid">

    <button class="key clear"
            onclick="clearAll()">
        AC
    </button>

    <button class="key delete"
            onclick="backspace()">
        ⌫
    </button>

    <button class="key operator"
            onclick="percent()">
        %
    </button>

    <button class="key operator"
            onclick="toggleSign()">
        ±
    </button>

    <button class="key operator"
            onclick="insert('÷')">
        ÷
    </button>

    <button class="key"
            onclick="insert('7')">
        7
    </button>

    <button class="key"
            onclick="insert('8')">
        8
    </button>

    <button class="key"
            onclick="insert('9')">
        9
    </button>

    <button class="key operator"
            onclick="insert('×')">
        ×
    </button>

    <button class="key operator"
            onclick="insert('−')">
        −
    </button>

    <button class="key"
            onclick="insert('4')">
        4
    </button>

    <button class="key"
            onclick="insert('5')">
        5
    </button>

    <button class="key"
            onclick="insert('6')">
        6
    </button>

    <button class="key operator"
            onclick="insert('+')">
        +
    </button>

    <button class="key equals"
            onclick="calculate()">
        =
    </button>

    <button class="key"
            onclick="insert('1')">
        1
    </button>

    <button class="key"
            onclick="insert('2')">
        2
    </button>

    <button class="key"
            onclick="insert('3')">
        3
    </button>

    <button class="key"
            onclick="insert('.')">
        .
    </button>

    <button class="key"
            onclick="insert('00')">
        00
    </button>

    <button class="key zero"
            onclick="insert('0')">
        0
    </button>

    <button class="key"
            onclick="insert('000')">
        000
    </button>

    <button class="key operator"
            onclick="insert('×')">
        ×
    </button>

</div>

<div id="history"
     class="history">

    <div class="history-head">

        <strong>
            Calculation History
        </strong>

        <button onclick="clearHistory()">
            Clear
        </button>

    </div>

    <div id="historyList"></div>

</div>

</div>

<script>

let expr = "";
let memory = 0;
let angle = "DEG";
let justCalculated = false;
let history = [];
let calculatorMode = "simple";

function setCalculatorMode(mode){

    calculatorMode = mode;

    const scientific =
        document.getElementById("scientificFunctions");

    const simpleBtn =
        document.getElementById("simpleBtn");

    const scientificBtn =
        document.getElementById("scientificBtn");

    const brand =
        document.getElementById("brand");

    if(mode === "scientific"){

        scientific.classList.add("show");
        scientificBtn.classList.add("active");
        simpleBtn.classList.remove("active");

        brand.textContent =
            "General Scientific Calculator";

    }else{

        scientific.classList.remove("show");
        simpleBtn.classList.add("active");
        scientificBtn.classList.remove("active");

        brand.textContent =
            "General Calculator";
    }
}

function render(){

    document.getElementById("expression").textContent =
        expr || "";

    document.getElementById("result").textContent =
        expr || "0";

}

function insert(value){

    if(
        justCalculated &&
        /[0-9πe.(]/.test(value)
    ){
        expr = "";
    }

    justCalculated = false;
    expr += value;
    render();
}

function clearAll(){

    expr = "";
    justCalculated = false;
    render();

}

function backspace(){

    expr = expr.slice(0,-1);
    justCalculated = false;
    render();

}

function setAngle(mode){

    angle = mode;

    document
        .getElementById("degBtn")
        .classList.toggle("active",mode === "DEG");

    document
        .getElementById("radBtn")
        .classList.toggle("active",mode === "RAD");

}

function fn(name){

    if(!expr) return;

    try{

        let value = evaluate(expr);

        if(!Number.isFinite(value))
            throw Error();

        if(name === "sin")
            value = Math.sin(
                angle === "DEG"
                ? value * Math.PI / 180
                : value
            );

        if(name === "cos")
            value = Math.cos(
                angle === "DEG"
                ? value * Math.PI / 180
                : value
            );

        if(name === "tan")
            value = Math.tan(
                angle === "DEG"
                ? value * Math.PI / 180
                : value
            );

        if(name === "log")
            value = Math.log10(value);

        if(name === "ln")
            value = Math.log(value);

        if(name === "sqrt")
            value = Math.sqrt(value);

        if(name === "square")
            value = value * value;

        if(name === "reciprocal")
            value = 1 / value;

        if(name === "factorial")
            value = factorial(value);

        expr = format(value);
        render();
        justCalculated = true;

    }catch(error){

        showError();

    }

}

function percent(){

    if(!expr) return;

    try{

        expr = format(evaluate(expr) / 100);
        render();
        justCalculated = true;

    }catch(error){

        showError();

    }

}

function toggleSign(){

    if(!expr) return;

    try{

        expr = format(-evaluate(expr));
        render();
        justCalculated = true;

    }catch(error){

        showError();

    }

}

function calculate(){

    if(!expr) return;

    try{

        const original = expr;
        const value = evaluate(expr);

        if(!Number.isFinite(value))
            throw Error();

        const answer = format(value);

        history.unshift({
            expression: original,
            result: answer
        });

        history = history.slice(0,30);

        expr = answer;
        render();
        justCalculated = true;

        saveHistory();
        renderHistory();

    }catch(error){

        showError();

    }

}

function evaluate(input){

    let x =
        input
        .replaceAll("×","*")
        .replaceAll("÷","/")
        .replaceAll("−","-")
        .replaceAll("π","Math.PI")
        .replace(/\be\b/g,"Math.E")
        .replaceAll("^","**");

    x =
        x.replace(
            /(\d|\)|Math\.PI|Math\.E)\s*(?=(Math\.PI|Math\.E|\())/g,
            "$1*"
        );

    if(!/^[0-9+\-*/().,\s*eMathPI_]+$/.test(x))
        throw Error();

    if(/Math\.(?!PI|E)/.test(x))
        throw Error();

    return Function(
        '"use strict";return (' + x + ')'
    )();

}

function factorial(number){

    if(
        !Number.isFinite(number) ||
        number < 0 ||
        Math.floor(number) !== number ||
        number > 170
    ){
        throw Error();
    }

    let result = 1;

    for(
        let i = 2;
        i <= number;
        i++
    ){
        result *= i;
    }

    return result;

}

function format(number){

    if(Object.is(number,-0))
        number = 0;

    if(Math.abs(number) < 1e-12)
        return "0";

    if(Number.isInteger(number))
        return String(number);

    return Number(
        number.toPrecision(12)
    ).toString();

}

function showError(){

    const result =
        document.getElementById("result");

    result.textContent = "Error";
    result.classList.add("error");

    expr = "";

}

function memoryClear(){
    memory = 0;
}

function memoryRecall(){
    insert(format(memory));
}

function memoryAdd(){

    try{
        memory += evaluate(expr || "0");
    }catch(error){}

}

function memorySub(){

    try{
        memory -= evaluate(expr || "0");
    }catch(error){}

}

function toggleHistory(){

    document
        .getElementById("history")
        .classList.toggle("open");

    renderHistory();

}

function saveHistory(){

    localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
    );

}

function loadHistory(){

    try{

        history =
            JSON.parse(
                localStorage.getItem(
                    "calculatorHistory"
                ) || "[]"
            );

    }catch(error){

        history = [];

    }

}

function renderHistory(){

    document.getElementById(
        "historyList"
    ).innerHTML = history.map(

        (item,index) => `

            <div
                class="history-item"
                onclick="useHistory(${index})"
            >

                <div class="h-exp">
                    ${escapeHTML(item.expression)}
                </div>

                <div class="h-res">
                    = ${escapeHTML(item.result)}
                </div>

            </div>

        `

    ).join("");

}

function useHistory(index){

    expr = history[index].result;
    justCalculated = true;
    render();

}

function clearHistory(){

    history = [];

    localStorage.removeItem(
        "calculatorHistory"
    );

    renderHistory();

}

function escapeHTML(text){

    return text.replace(
        /[&<>"']/g,
        function(character){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[character];

        }
    );

}

document.addEventListener(
    "keydown",
    function(event){

        const key = event.key;

        if(/[0-9.]/.test(key))
            insert(key);

        else if(key === "+")
            insert("+");

        else if(key === "-")
            insert("−");

        else if(key === "*")
            insert("×");

        else if(key === "/"){

            event.preventDefault();
            insert("÷");

        }

        else if(
            key === "Enter" ||
            key === "="
        ){
            calculate();
        }

        else if(key === "Backspace")
            backspace();

        else if(key === "Escape")
            clearAll();

        else if(key === "%")
            percent();

        else if(
            key === "(" ||
            key === ")"
        ){
            insert(key);
        }

    }
);

loadHistory();
render();
renderHistory();
setCalculatorMode("simple");

</script>

<script src="calculators.js"></script>

</body>
</html>
