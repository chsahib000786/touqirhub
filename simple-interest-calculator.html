<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple Interest Calculator | TouqirHub</title>
    <meta name="description" content="Free Simple Interest Calculator. Calculate interest and total amount quickly and easily.">

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 600px;
            margin: auto;
            padding: 45px 18px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 34px;
        }

        .calculator-card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(25, 35, 55, 0.08);
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce2ea;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #f1f8f4;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 29px;
            }

            .calculator-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Simple Interest Calculator</h1>

    <div class="calculator-card">

        <label for="principal">Principal Amount</label>
        <input
            type="number"
            id="principal"
            placeholder="e.g. 10000"
            min="0"
            step="0.01"
        >

        <label for="rate">Annual Interest Rate (%)</label>
        <input
            type="number"
            id="rate"
            placeholder="e.g. 5"
            min="0"
            step="0.01"
        >

        <label for="time">Time (Years)</label>
        <input
            type="number"
            id="time"
            placeholder="e.g. 3"
            min="0"
            step="0.1"
        >

        <button onclick="calculateSimpleInterest()">
            Calculate Interest
        </button>

        <div id="result" class="result">
            Enter your values.
        </div>

    </div>

    <a href="calculators.html" class="back">
        ← Back to Calculators
    </a>

</div>

<script>
function calculateSimpleInterest() {

    const principal =
        parseFloat(document.getElementById("principal").value);

    const rate =
        parseFloat(document.getElementById("rate").value);

    const time =
        parseFloat(document.getElementById("time").value);

    const result =
        document.getElementById("result");

    if (
        isNaN(principal) ||
        isNaN(rate) ||
        isNaN(time) ||
        principal < 0 ||
        rate < 0 ||
        time < 0
    ) {
        result.innerHTML =
            "Please enter valid values.";
        return;
    }

    const interest =
        (principal * rate * time) / 100;

    const total =
        principal + interest;

    result.innerHTML =
        "<strong>Simple Interest:</strong> " +
        interest.toFixed(2) +
        "<br>" +
        "<strong>Total Amount:</strong> " +
        total.toFixed(2);
}
</script>

</body>
</html>
