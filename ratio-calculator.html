<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ratio Calculator</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(25, 35, 55, 0.08);
        }

        .ratio-row {
            display: grid;
            grid-template-columns: 1fr 55px 1fr;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
        }

        .ratio-symbol {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1ea;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .result {
            margin-top: 22px;
            padding: 18px;
            border-radius: 12px;
            background: #f0fdf4;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #166534;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            .calculator-container {
                padding: 35px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .calculator-card {
                padding: 22px;
            }

            .ratio-row {
                grid-template-columns: 1fr 45px 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Ratio Calculator</h1>

    <div class="calculator-card">

        <div class="ratio-row">
            <input type="number" id="value1" placeholder="First value">
            <div class="ratio-symbol">:</div>
            <input type="number" id="value2" placeholder="Second value">
        </div>

        <button onclick="calculateRatio()">Calculate Ratio</button>

        <div id="result" class="result">
            Result will appear here
        </div>

    </div>

</div>

<script>
function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);

    while (b !== 0) {
        let temp = b;
        b = a % b;
        a = temp;
    }

    return a;
}

function calculateRatio() {

    const value1 = parseInt(document.getElementById("value1").value);
    const value2 = parseInt(document.getElementById("value2").value);
    const result = document.getElementById("result");

    if (isNaN(value1) || isNaN(value2)) {
        result.textContent = "Please enter both values.";
        return;
    }

    if (value1 === 0 && value2 === 0) {
        result.textContent = "Both values cannot be zero.";
        return;
    }

    if (value2 === 0) {
        result.textContent = "The second value cannot be zero.";
        return;
    }

    const divisor = gcd(value1, value2);

    const simplified1 = value1 / divisor;
    const simplified2 = value2 / divisor;

    const decimalRatio = value1 / value2;

    result.innerHTML =
        "Simplified Ratio = " +
        simplified1 + " : " + simplified2 +
        "<br>Ratio = " +
        decimalRatio.toFixed(4);
}
</script>

</body>
</html>
