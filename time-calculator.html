<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Time Calculator</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            color: #172033;
        }

        .calculator-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 45px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(25, 35, 55, 0.08);
        }

        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce1ea;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .result {
            margin-top: 22px;
            padding: 18px;
            border-radius: 12px;
            background: #f0fdf4;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #166534;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            .calculator-container {
                padding: 35px 15px;
            }

            h1 {
                font-size: 30px;
            }

            .calculator-card {
                padding: 22px;
            }

            .time-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="calculator-container">

    <h1>Time Calculator</h1>

    <div class="calculator-card">

        <label>First Time</label>

        <div class="time-row">
            <input type="number" id="hours1" placeholder="Hours" min="0">
            <input type="number" id="minutes1" placeholder="Minutes" min="0">
        </div>

        <label>Operation</label>

        <select id="operation">
            <option value="add">Add Time</option>
            <option value="subtract">Subtract Time</option>
        </select>

        <label>Second Time</label>

        <div class="time-row">
            <input type="number" id="hours2" placeholder="Hours" min="0">
            <input type="number" id="minutes2" placeholder="Minutes" min="0">
        </div>

        <button onclick="calculateTime()">Calculate</button>

        <div id="result" class="result">
            Result will appear here
        </div>

    </div>

</div>

<script>
function calculateTime() {

    const hours1 = parseInt(document.getElementById("hours1").value) || 0;
    const minutes1 = parseInt(document.getElementById("minutes1").value) || 0;

    const hours2 = parseInt(document.getElementById("hours2").value) || 0;
    const minutes2 = parseInt(document.getElementById("minutes2").value) || 0;

    const operation = document.getElementById("operation").value;
    const result = document.getElementById("result");

    const totalMinutes1 = (hours1 * 60) + minutes1;
    const totalMinutes2 = (hours2 * 60) + minutes2;

    let totalMinutes;

    if (operation === "add") {
        totalMinutes = totalMinutes1 + totalMinutes2;
    } else {
        totalMinutes = totalMinutes1 - totalMinutes2;
    }

    const sign = totalMinutes < 0 ? "-" : "";
    const absoluteMinutes = Math.abs(totalMinutes);

    const hours = Math.floor(absoluteMinutes / 60);
    const minutes = absoluteMinutes % 60;

    result.innerHTML =
        "Result: " + sign + hours + " hours " + minutes + " minutes";
}
</script>

</body>
</html>
